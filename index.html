<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cinehound-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <title>CineHound — Sniff out your next favorite film</title>
    <meta name="description" content="CineHound finds your next favorite movie based on what you already love. A personalized recommendation engine powered by collaborative filtering." />

    <!-- Open Graph -->
    <meta property="og:site_name" content="CineHound" />
    <meta property="og:title" content="CineHound — Sniff out your next favorite film" />
    <meta property="og:description" content="A personalized movie recommendation engine powered by collaborative filtering. Rate what you love and CineHound surfaces your next favorites." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/cinehound-icon.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Prevent a theme flash on first paint: apply the stored/OS theme to
         <html> before the app bundle runs. Pure cosmetic; no app logic. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cinehound-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
