name: Rebuild Movie Similarity Matrix

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild similarity matrix
        run: |
          node scripts/cache-movie-metadata.js
          node scripts/rebuild-similarity-matrix.js

      - name: Validate matrix output
        run: |
          test -f scripts/output/movie_similarity.json
          node -e "const matrix=require('./scripts/output/movie_similarity.json'); console.log('Matrix entries:', Object.keys(matrix).length)"

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie_similarity
          path: scripts/output/movie_similarity.json
